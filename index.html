<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pdtalbum.com - Login</title>
    
    <!-- Google Fonts: Montserrat & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Sedikit gaya tambahan khas untuk butang toggle password -->
    <style>
        .password-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-box input {
            width: 100%;
            padding-right: 45px; /* Ruang untuk ikon mata */
        }
        .toggle-password-btn {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="login-page">

    <!-- Kad Utama Log Masuk -->
    <div class="login-wrapper">
        <div class="login-container">
            
            <!-- Bahagian Kiri: Bentuk Geometri Biru, Bayang & Gambar -->
            <div class="left-banner">
                <!-- Lapisan Bayang untuk Efek Timbul -->
                <div class="shape-shadow-1"></div>
                <div class="shape-shadow-2"></div>

                <!-- Gambar Utama di Belakang -->
                <div class="banner-content">
                    <img src="img/img3.jpeg" alt="Ilustrasi" class="banner-image">
                </div>

                <!-- Dua Segi Tiga yang akan bergerak dan menjadi bingkai -->
                <div class="shape-triangle-top"></div>
                <div class="shape-triangle-bottom"></div>
            </div>

            <!-- Bahagian Kanan: Borang Log Masuk -->
            <div class="right-form-section">
                
                <!-- Logo di atas borang -->
                <div class="form-logo">
                    <img src="img/img1.png" alt="Jata Tangkak">
                </div>

                <!-- Borang log masuk biasa di mana anda boleh taip ID & Password anda -->
                <form id="loginForm" class="modern-form">
                    
                    <div class="input-box">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" placeholder="ID" required autocomplete="off">
                    </div>

                    <div class="input-box password-box">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" placeholder="Password" required>
                        <button type="button" id="togglePasswordBtn" class="toggle-password-btn" onclick="togglePasswordVisibility()">
                            <!-- Ikon Mata SVG (Biasa) -->
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                    <button type="submit" class="login-btn">LOG MASUK</button>
                </form>

            </div>

        </div>
    </div>

    <!-- Pautan ke fail JavaScript luaran -->
    <script src="js/script.js"></script>

</body>
</html>
