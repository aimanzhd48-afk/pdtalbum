<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pdtalbum.com - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Kad Utama Log Masuk -->
    <div class="login-wrapper">
        <div class="login-container">
            
            <!-- Bahagian Kiri: Bentuk Geometri Biru, Bayang & Gambar -->
            <div class="left-banner">
                <!-- Lapisan Bayang untuk Efek Timbul -->
                <div class="shape-shadow-1"></div>
                <div class="shape-shadow-2"></div>

                <!-- Gambar Utama di Belakang -->
                <div class="banner-content">
                    <img src="img/img3.jpeg" alt="Ilustrasi" class="banner-image">
                </div>

                <!-- Dua Segi Tiga yang akan bergerak dan menjadi bingkai -->
                <div class="shape-triangle-top"></div>
                <div class="shape-triangle-bottom"></div>
            </div>

            <!-- Bahagian Kanan: Borang Log Masuk -->
            <div class="right-form-section">
                
                <!-- Logo di atas borang -->
                <div class="form-logo">
                    <img src="img/img1.png" alt="Jata Tangkak">
                </div>

                <!-- Borang log masuk biasa di mana anda boleh taip ID & Password anda -->
                <form id="loginForm" class="modern-form">
                    
                    <div class="input-box">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" placeholder="ID" required autocomplete="off">
                    </div>

                    <div class="input-box">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>

                    <button type="submit" class="login-btn">LOG MASUK</button>
                </form>

            </div>

        </div>
    </div>

    <!-- Pautan ke fail JavaScript luaran -->
    <script src="js/script.js"></script>

</body>
</html>
